<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Link Cài Đặt IPA (iOS)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364); background-size: 400% 400%; animation: gradientBG 15s ease infinite; height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 28px; padding: 40px; width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); text-align: center; }
        .logo-icon { font-size: 56px; margin-bottom: 15px; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #1d1d1f; }
        p.subtitle { font-size: 14px; color: #86868b; margin-bottom: 30px; line-height: 1.5; }
        .input-field { width: 100%; padding: 18px; border-radius: 14px; border: 2px solid rgba(0, 122, 255, 0.2); font-size: 15px; margin-bottom: 20px; outline: none; transition: all 0.3s; background: #f5f5f7; }
        .input-field:focus { border-color: #007aff; background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        .btn { display: inline-block; width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #007aff; color: white; box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3); }
        .btn-primary:hover { background: #005ce6; transform: translateY(-2px); }
        .btn-success { background: #34c759; color: white; box-shadow: 0 10px 20px rgba(52, 199, 89, 0.3); }
        .error-box { background: #ffe5e5; color: #d60000; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; text-align: left; word-break: break-word; }
        .hint { margin-top: 20px; font-size: 13px; color: #a1a1a6; }
    </style>
</head>
<body>
    <div class="card" id="app-card">
        <div id="main-view">
            <div class="logo-icon">🚀</div>
            <h2>Chuyển đổi Link IPA</h2>
            <p class="subtitle">Dán link từ Loadly để trích xuất link Cài đặt trực tiếp (itms-services) cho iOS.</p>
            <form id="linkForm">
                <input type="text" id="urlInput" class="input-field" placeholder="Dán link Loadly vào đây..." required>
                <button type="submit" id="submitBtnLink" class="btn btn-primary">Lấy Link Cài Đặt</button>
            </form>
            <p class="hint">Tốc độ xử lý siêu tốc, không cần máy chủ.</p>
        </div>

        <div id="result-view" style="display: none;"></div>
    </div>

    <script>
        const API_KEY = '078900d66be168c56a12e58e1eb0664f';
        const mainView = document.getElementById('main-view');
        const resultView = document.getElementById('result-view');
        
        function renderResult(status, content) {
            mainView.style.display = 'none';
            resultView.style.display = 'block';
            if (status === 'success') {
                resultView.innerHTML = `
                    <div class="logo-icon">✅</div><h2>Thành công!</h2>
                    <p class="subtitle">Link đã sẵn sàng để cài đặt.</p>
                    <a href="${content}" class="btn btn-success">Cài Đặt Ngay (Install)</a>
                    <br><br><a href="#" onclick="location.reload()" style="color: #007aff; text-decoration: none; font-size: 14px; font-weight: 600;">+ Trở về trang chủ</a>
                `;
            } else {
                resultView.innerHTML = `
                    <div class="logo-icon">⚠️</div><h2>Đã xảy ra lỗi</h2>
                    <div class="error-box">${content}</div>
                    <a href="#" onclick="location.reload()" class="btn btn-primary">Thử lại</a>
                `;
            }
        }

        document.getElementById('linkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const urlValue = document.getElementById('urlInput').value.trim();
            if (!urlValue) return;

            // Bóc tách mã
            let shortcode = '';
            const match = urlValue.match(/loadly\.io\/([a-zA-Z0-9]+)/i);
            if (match) {
                shortcode = match[1];
            } else {
                const parts = urlValue.split('/');
                shortcode = parts[parts.length - 1];
            }

            const btn = document.getElementById('submitBtnLink');
            btn.innerText = "Đang quét dữ liệu..."; 
            btn.style.opacity = 0.7; 
            btn.disabled = true;

            try {
                let installUrl = '';

                // BƯỚC 1: DÙNG PROXY
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://loadly.io/' + shortcode)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.contents) {
                    const html = data.contents;
                    const linkMatch = html.match(/(itms-services:\/\/\?action=download-manifest&url=[^"'\s>]+)/i);
                    const buildKeyMatch = html.match(/plist\/([a-zA-Z0-9]+)/i) || html.match(/buildKey["']?\s*[:=]\s*["']([a-zA-Z0-9]+)["']/i);

                    if (linkMatch) installUrl = linkMatch[1];
                    else if (buildKeyMatch) installUrl = `itms-services://?action=download-manifest&url=https://loadly.io/app/plist/${buildKeyMatch[1]}`;
                }

                // BƯỚC 2: DỰ PHÒNG QUA API
                if (!installUrl) {
                    const formData = new FormData();
                    formData.append('_api_key', API_KEY);
                    formData.append('appKey', shortcode);
                    
                    const apiRes = await fetch('https://api.loadly.io/apiv2/app/view', {
                        method: 'POST',
                        body: formData
                    });
                    const apiJson = await apiRes.json();
                    const bKey = apiJson.data?.buildKey || apiJson.buildKey;
                    
                    if (bKey) installUrl = `itms-services://?action=download-manifest&url=https://loadly.io/app/plist/${bKey}`;
                }

                if (installUrl) renderResult('success', installUrl);
                else renderResult('error', "Không thể lấy link. App đã bị khóa hoặc bị xóa.");

            } catch (error) {
                renderResult('error', "Lỗi mạng: " + error.message);
            }
        });
    </script>
</body>
</html>
